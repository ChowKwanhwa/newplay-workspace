[project]
name = "newplay-workspace"
version = "0.1.0"
description = "Private NewPlay production workspace and migration tools"
requires-python = ">=3.14,<3.15"
dependencies = [
  "beautifulsoup4==4.14.3",
  "defusedxml>=0.7,<0.8",
  "fonttools[woff]==4.63.0",
  "lxml==6.0.2",
  "openpyxl>=3.1,<3.2",
  "pdfplumber>=0.11,<0.12",
  "pillow==12.1.1",
  "playwright==1.57.0",
  "pymupdf==1.27.1",
  "pypdf>=6,<7",
  "pypdfium2>=4,<6",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "qrcode[pil]>=8,<9",
  "reportlab>=4,<5",
  "requests==2.32.5",
  "telethon>=1.43,<2",
]

[project.optional-dependencies]
transcription = ["mlx-whisper>=0.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv]
package = false
